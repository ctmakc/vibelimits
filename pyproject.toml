[project]
name = "vibelimits"
version = "0.1.0"
description = "The quota radar for AI coding agents"
license = {text = "Apache-2.0"}
readme = "README.md"
keywords = ["ai", "coding-agents", "codex", "claude-code", "quota", "rate-limits", "telegram"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
]

[project.urls]
Homepage = "https://github.com/ctmakc/vibelimits"
Repository = "https://github.com/ctmakc/vibelimits"
Issues = "https://github.com/ctmakc/vibelimits/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vibelimits = "vibelimits.main:cli"
vibelimits-worker = "vibelimits.worker:cli"
vibelimits-sensor = "vibelimits.sensor.agent:cli"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vibelimits*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
